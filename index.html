        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[22.277494618325868,113.90018281484004],[22.298766517930638,113.96982296235566]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_9SEA_0');
        map.getPane('pane_9SEA_0').style.zIndex = 400;
        var img_9SEA_0 = 'data/9SEA_0.png';
        var img_bounds_9SEA_0 = [[22.273607952312364,113.89769308407159],[22.300758044667496,113.93413201704129]];

        function pop_M1_point_week5_format_m14_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Photograph</th>\
                        <td class="visible-with-data" id="Photograph">' + (feature.properties['Photograph'] !== null ? '<img src="images/' + String(feature.properties['Photograph']).replace(/[\\/:]/g, '_').trim().replace(/'/g, '\'').replace(/"/g, '&quot;') + '">' : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Place_name</th>\
                        <td class="visible-with-data" id="Place_name">' + (feature.properties['Place_name'] !== null ? autolinker.link(String(feature.properties['Place_name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">File_name</th>\
                        <td class="visible-with-data" id="File_name">' + (feature.properties['File_name'] !== null ? autolinker.link(String(feature.properties['File_name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Date</th>\
                        <td class="visible-with-data" id="Date">' + (feature.properties['Date'] !== null ? autolinker.link(String(feature.properties['Date']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Subject</th>\
                        <td class="visible-with-data" id="Subject">' + (feature.properties['Subject'] !== null ? autolinker.link(String(feature.properties['Subject']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Direction</th>\
                        <td class="visible-with-data" id="Direction">' + (feature.properties['Direction'] !== null ? autolinker.link(String(feature.properties['Direction']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Latitude</th>\
                        <td class="visible-with-data" id="Latitude">' + (feature.properties['Latitude'] !== null ? autolinker.link(String(feature.properties['Latitude']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Longitude</th>\
                        <td class="visible-with-data" id="Longitude">' + (feature.properties['Longitude'] !== null ? autolinker.link(String(feature.properties['Longitude']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Precision</th>\
                        <td class="visible-with-data" id="Precision">' + (feature.properties['Precision'] !== null ? autolinker.link(String(feature.properties['Precision']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Source</th>\
                        <td class="visible-with-data" id="Source">' + (feature.properties['Source'] !== null ? autolinker.link(String(feature.properties['Source']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_M1_point_week5_format_m14_2_0() {
            return {
                pane: 'pane_M1_point_week5_format_m14_2',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',

                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(231,113,72,1.0)',

        }
        map.createPane('pane_M1_point_week5_format_m14_2');
        map.getPane('pane_M1_point_week5_format_m14_2').style.zIndex = 402;
        map.getPane('pane_M1_point_week5_format_m14_2').style['mix-blend-mode'] = 'normal';
        var layer_M1_point_week5_format_m14_2 = new L.geoJson(json_M1_point_week5_format_m14_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_M1_point_week5_format_m14_2',
            layerName: 'layer_M1_point_week5_format_m14_2',
            pane: 'pane_M1_point_week5_format_m14_2',
            onEachFeature: pop_M1_point_week5_format_m14_2,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_M1_point_week5_format_m14_2_0(feature));
            },
        });
        var cluster_M1_point_week5_format_m14_2 = new L.MarkerClusterGroup({showCoverageOnHover: false,
            spiderfyDistanceMultiplier: 2});
        cluster_M1_point_week5_format_m14_2.addLayer(layer_M1_point_week5_format_m14_2);

        bounds_group.addLayer(layer_M1_point_week5_format_m14_2);
        cluster_M1_point_week5_format_m14_2.addTo(map);
        map.createPane('pane_63D9SE8D00_3');
        map.getPane('pane_63D9SE8D00_3').style.zIndex = 403;
        var img_63D9SE8D00_3 = 'data/63D9SE8D00_3.png';
        var img_bounds_63D9SE8D00_3 = [[22.27908664550362,113.93411125972408],[22.284515695281364,113.94139793561807]];
        var layer_63D9SE8D00_3 = new L.imageOverlay(img_63D9SE8D00_3,
                                              img_bounds_63D9SE8D00_3,
                                              {pane: 'pane_63D9SE8D00_3'});
        bounds_group.addLayer(layer_63D9SE8D00_3);
        map.addLayer(layer_63D9SE8D00_3);
        map.createPane('pane_63D9SE8B00_4');
        map.getPane('pane_63D9SE8B00_4').style.zIndex = 404;
        var img_63D9SE8B00_4 = 'data/63D9SE8B00_4.png';
        var img_bounds_63D9SE8B00_4 = [[22.2845049777764,113.93410190516055],[22.289934026843603,113.94138886434231]];
        var layer_63D9SE8B00_4 = new L.imageOverlay(img_63D9SE8B00_4,
                                              img_bounds_63D9SE8B00_4,
                                              {pane: 'pane_63D9SE8B00_4'});
        bounds_group.addLayer(layer_63D9SE8B00_4);
        map.addLayer(layer_63D9SE8B00_4);
        setBounds();
        var i = 0;
        layer_M1_point_week5_format_m14_2.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['Place_name'] !== null?String('<div style="color: #000000; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['Place_name']).replace(/\\n/g, '<br>') + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_M1_point_week5_format_m14_2'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        resetLabels([layer_M1_point_week5_format_m14_2]);
        map.on("zoomend", function(){
            resetLabels([layer_M1_point_week5_format_m14_2]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_M1_point_week5_format_m14_2]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_M1_point_week5_format_m14_2]);
